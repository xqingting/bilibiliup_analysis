[package]
name = "bilibiliup-analysis"
version = "2.0.0"
description = "B站UP主数据分析工坊 — 航海榜/粉丝/UID/词频"
authors = ["xqingting"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "cookies",
    "json",
] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
